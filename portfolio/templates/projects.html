{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Projects</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

<h1>My Projects</h1>

{% for project in projects %}

<h2>
    <a href="{% url 'project_detail' project.id %}">
        {{ project.project_name }}
    </a>
</h2>

<p>{{ project.description }}</p>

<hr>

{% empty %}

<p>No projects available.</p>

{% endfor %}

</body>
</html>
