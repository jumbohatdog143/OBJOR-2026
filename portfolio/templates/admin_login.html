<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Sign In - Khalia's Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #020214;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 40px;
            background: #0b0b22;
            border-radius: 15px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.5);
        }

        .login-container h1 {
            margin: 0 0 10px;
            text-align: center;
            font-size: 32px;
        }

        .login-container > p {
            text-align: center;
            color: #bdbdd0;
            margin-bottom: 30px;
        }

        .error-message {
            background: #4a1515;
            color: #ff8f8f;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #343454;
            border-radius: 8px;
            background: #050517;
            color: white;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #8b5cf6;
        }

        button {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #8b5cf6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7445d8;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #aaaac0;
            text-decoration: none;
        }

        .back-link:hover {
            color: white;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Admin Sign In</h1>

        <p>Sign in using your administrator account.</p>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label for="username">Username</label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter your username"
                    required
                >
            </div>

            <div class="form-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit">
                Sign In
            </button>
        </form>

        <a class="back-link" href="{% url 'home' %}">
            Back to Portfolio
        </a>

    </div>

</body>
</html>
